{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Delete Personal Information</h2>
    <p>Are you sure you want to delete the personal information for <strong>{{ object.full_name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'resume_builder:personal_information_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
