{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Delete Technical Skill</h2>
    <p>Are you sure you want to delete the technical skill <strong>{{ object.technology }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'resume_builder:technical_skill_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
